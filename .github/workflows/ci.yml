name: CI/CD

on:
  push:
    branches: [ main ]

  workflow_dispatch:

permissions:
  contents:      write
  packages:      write
  issues:        write
  pull-requests: write

jobs:
  pipeline:
    uses: DasRed/github-workflows/.github/workflows/node-docker.yml@v1
    secrets:
      dockhand-host: ${{ secrets.DOCKHAND_HOST }}
      dockhand-token: ${{ secrets.DOCKHAND_TOKEN }}
      homeassistant-webhook-url: ${{ secrets.HOMEASSISTANT_WEBHOOK_URL }}
    with:
      # no container exists yet; set deploy to true once mcp-backrest runs in the stack
      deploy: false
      environment: chronos
      container-name: mcp-backrest

